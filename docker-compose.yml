# Local development stack: PostgreSQL + migrations + API + web.
#   cp .env.example .env
#   docker compose up --build
# This file is for LOCAL use. See docs/ARCHITECTURE.md ("Deployment") for production guidance.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # bound to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-attendance}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-dev}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CURRENT_ACADEMIC_YEAR: ${CURRENT_ACADEMIC_YEAR:-2026/2027}
      CURRENT_SEMESTER: ${CURRENT_SEMESTER:-1}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_TIMEZONE: ${NEXT_PUBLIC_TIMEZONE:-Africa/Lagos}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
